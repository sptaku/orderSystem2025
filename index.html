<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>忘年会オーダーシステム</title>
  <link rel="stylesheet" href="style.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>🍛 忘年会オーダーシステム</h1>
      <p class="subtitle">インド料理店 メニュー注文フォーム</p>
      <p class="deadline">📅 締切: 12月24日(水)まで</p>
    </header>

    <!-- 注文フォーム -->
    <main id="order-tab" class="tab-content active">
      <form id="order-form">
        <section class="form-section">
          <label class="form-label required">お名前</label>
          <input type="text" id="name" required placeholder="お名前を入力してください">
        </section>

        <section class="form-section">
          <label class="form-label required">オーダータイプ</label>
          <div class="radio-group type-selection">
            <label class="radio-card">
              <input type="radio" name="order-type" value="set" required>
              <div class="card-content">
                <span class="card-icon">🍽️</span>
                <span class="card-title">①セットメニュー</span>
                <span class="card-desc">4種類のセットから選択</span>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="order-type" value="alacarte">
              <div class="card-content">
                <span class="card-icon">🥘</span>
                <span class="card-title">②アラカルト</span>
                <span class="card-desc">単品メニューから選択</span>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="order-type" value="kids">
              <div class="card-content">
                <span class="card-icon">👶</span>
                <span class="card-title">③子どもセット</span>
                <span class="card-desc">小学生までのお子様</span>
              </div>
            </label>
            <label class="radio-card">
              <input type="radio" name="order-type" value="drink-only">
              <div class="card-content">
                <span class="card-icon">🍹</span>
                <span class="card-title">④ドリンクのみ</span>
                <span class="card-desc">ワンドリンクオーダー</span>
              </div>
            </label>
          </div>
        </section>

        <!-- セットメニュー選択 -->
        <div id="set-options" class="conditional-section hidden">
          <section class="form-section">
            <label class="form-label required">セットを選択</label>
            <div class="radio-group">
              <label class="radio-option">
                <input type="radio" name="set-type" value="shanti">
                <span class="option-content">
                  <strong>サンティセット</strong> - 1,485円
                  <small>カレー1種、ナン又はライス、サラダ、飲み物</small>
                </span>
              </label>
              <label class="radio-option">
                <input type="radio" name="set-type" value="ladies">
                <span class="option-content">
                  <strong>レディースセット（男性も可）</strong> - 1,850円
                  <small>カレー2種、ナン、ライス、サラダ、デザート、タンドリーチキン1個、飲み物</small>
                </span>
              </label>
              <label class="radio-option">
                <input type="radio" name="set-type" value="tandoori">
                <span class="option-content">
                  <strong>タンドリー焼き肉とカレーのセット</strong> - 2,100円
                  <small>カレー1種、ナン又はライス、サラダ、タンドリーチキン・シークカバブ・チキンティッカ各1個</small>
                </span>
              </label>
              <label class="radio-option">
                <input type="radio" name="set-type" value="biryani">
                <span class="option-content">
                  <strong>ビリヤニセット</strong> - 1,650円
                  <small>ビリヤニ1種、カレースープ、サラダ、飲み物</small>
                </span>
              </label>
            </div>
          </section>

          <!-- サンティセット用 ナン/ライス選択 -->
          <div id="naan-rice-choice" class="conditional-section hidden">
            <section class="form-section">
              <label class="form-label required">ナン or ライス</label>
              <div class="radio-group horizontal">
                <label class="radio-option">
                  <input type="radio" name="naan-rice" value="naan">
                  <span>ナン</span>
                </label>
                <label class="radio-option">
                  <input type="radio" name="naan-rice" value="rice">
                  <span>ライス</span>
                </label>
              </div>
            </section>
          </div>

                </optgroup>
                <optgroup label="🐑 マトンカレー">
                  <option value="マトンカレー(880円)">マトンカレー - ¥880</option>
                  <option value="マトンマサラカレー(979円)">マトンマサラカレー - ¥979</option>
                  <option value="マトンドピアザカレー(979円)">マトンドピアザカレー（新鮮な玉ねぎ）- ¥979</option>

                  <option value="グリンピースとチーズカレー(999円)">グリンピースとチーズカレー - ¥999</option>
                  <option value="チーズバターカレー(990円)">チーズバターカレー - ¥990</option>
                  <option value="ヒヨコマメマサラカレー(913円)">ヒヨコマメマサラカレー - ¥913</option>
                </optgroup>
                <optgroup label="🦐 シーフードカレー">
                  <option value="エビカレー(990円)">エビカレー - ¥990</option>

                  <option value="ほうれん草シーフードカレー(1034円)">ほうれん草シーフードカレー - ¥1,034</option>

                  <option value="卵キーマカレー(935円)">卵キーマカレー - ¥935</option>
                  <option value="茄子キーマカレー(935円)">茄子キーマカレー - ¥935</option>
                </optgroup>
              </select>
            </section>
          </div>

          <!-- カレー選択（レディース用 2種類） -->

              <label class="form-label required">カレーを2種類選択</label>

                    <option value="グリンピースとチーズカレー">グリンピースとチーズカレー - ¥999</option>
                    <option value="チーズバターカレー">チーズバターカレー - ¥990</option>
                    <option value="ヒヨコマメマサラカレー">ヒヨコマメマサラカレー - ¥913</option>
                  </optgroup>
                  <optgroup label="🦐 シーフードカレー">
                    <option value="エビカレー">エビカレー - ¥990</option>
                    <option value="エビマサラカレー">エビマサラカレー - ¥1,012</option>
                    <option value="エビドピアザカレー">エビドピアザカレー - ¥1,034</option>
                    <option value="ほうれん草と海老カレー">ほうれん草と海老カレー - ¥1,034</option>
                    <option value="エビバターカレー">エビバターカレー - ¥1,034</option>
                    <option value="ミックスシーフードカレー">ミックスシーフードカレー - ¥990</option>
                    <option value="ほうれん草シーフードカレー">ほうれん草シーフードカレー - ¥1,034</option>
                  </optgroup>
                  <optgroup label="🍖 キーマカレー">
                    <option value="キーマカレー">キーマカレー - ¥902</option>
                    <option value="卵キーマカレー">卵キーマカレー - ¥935</option>
                    <option value="茄子キーマカレー">茄子キーマカレー - ¥935</option>
                  </optgroup>
                </select>
                <label>2種類目</label>
                <select id="curry-2b" class="form-select">
                  <option value="">-- カレーを選んでください --</option>
                  <optgroup label="🐔 チキンカレー">
                    <option value="チキンカレー">チキンカレー - ¥880</option>
                    <option value="チキンマサラカレー">チキンマサラカレー - ¥913</option>
                    <option value="新鮮な玉ねぎチキンカレー">新鮮な玉ねぎチキンカレー - ¥935</option>

          <!-- ビリヤニ選択 -->

            <section class="form-section">
              <label class="form-label required">ビリヤニの種類を選択</label>
              <div class="radio-group horizontal">
                <label class="radio-option">
                  <input type="radio" name="biryani-type" value="チキンビリヤニ">
                  <span>チキン</span>
                </label>

              <label class="form-label required">ドリンクの種類</label>
              <div class="radio-group horizontal">

                  <span>生ビール（+100円 = 2,200円）</span>
                </label>
              </div>
            </section>
          </div>

          <!-- セットドリンク選択 -->
          <div id="set-drink-choice" class="conditional-section hidden">
            <section class="form-section">
              <label class="form-label required">セットドリンクを選択</label>
              <p class="form-hint">※セットに1杯付いています。お酒に変更する場合はアルコール価格から-100円</p>

          <div id="naan-upgrade-choice" class="conditional-section hidden">
